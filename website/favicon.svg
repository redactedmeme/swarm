<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="[REDACTED]">
  <!-- White ground so the mark holds against dark browser chrome, where the old black
       square vanished. Brackets are drawn as rectangles rather than text glyphs: at
       16px a font-rendered "[" collapses to a smudge, four rects do not. -->
  <rect width="64" height="64" fill="#FFFCFC"/>
  <g fill="#080809">
    <!-- left bracket -->
    <rect x="11" y="9"  width="9"  height="46"/>
    <rect x="11" y="9"  width="17" height="9"/>
    <rect x="11" y="46" width="17" height="9"/>
    <!-- right bracket -->
    <rect x="44" y="9"  width="9"  height="46"/>
    <rect x="36" y="9"  width="17" height="9"/>
    <rect x="36" y="46" width="17" height="9"/>
  </g>
</svg>
