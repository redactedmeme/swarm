# swarm-refinery service block.
# Paste this `refinery:` service into infra/node/swarm-infra-docker-compose.yml
# alongside redis, postgres, qdrant and the other swarm agents.
#
# Build context: the REPO ROOT (refinery imports packages/swarm-core).
#
# Volumes:
#   - /sources/smolting: read-only mount of smolting's /data volume
#   - /sources/hermes:   read-only mount of hermes-bot's /data volume
#   - /sources/redacted-chan: read-only mount of redacted-chan's /data directory
#   - /models:           cache volume for fastembed model weights (~500MB)

services:
  refinery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swarm-refinery
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:REDACTED@swarm-redis:6379/0
      DATABASE_URL: postgresql://swarm:swarm_secret@swarm-postgres:5432/swarm
      QDRANT_URL: http://swarm-qdrant:6333
      SRC_SMOLTING: /sources/smolting
      SRC_HERMES: /sources/hermes
      SRC_REDACTED_CHAN: /sources/redacted-chan
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: openai/gpt-oss-120b
      PROXY_TOKEN: ${PROXY_TOKEN}
      PYTHONUNBUFFERED: "1"
    volumes:
      - smoltingdata:/sources/smolting:ro
      - hermesdata:/sources/hermes:ro
      - redactedchandata:/sources/redacted-chan:ro
      - refinerymodels:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    network_mode: host

# Add to the top-level `volumes:` map:
#   refinerymodels:
