[build]
  builder = "DOCKERFILE"
  # Context is the repo root so the image can install packages/swarm-core.
  dockerfilePath = "apps/terminal/Dockerfile"

[deploy]
  # No startCommand: the Dockerfile CMD wraps gunicorn in `sh -c` so that $PORT
  # expands. A startCommand here is exec'd directly with no shell, which turns
  # `--bind 0.0.0.0:$PORT` into a literal and the container fails to bind.
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3
