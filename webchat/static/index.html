<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>redacted-chan_</title>
<style>
  /* ── Reset & base ──────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ──────────────────────────────────────────────────────── */
  #topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid #1a1a1a;
    flex-shrink: 0;
    user-select: none;
  }

  #topbar-title {
    font-size: 15px;
    letter-spacing: 0.05em;
  }

  #cursor {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: #e0e0e0;
    vertical-align: middle;
    margin-left: 2px;
    animation: blink 1.1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }

  #status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #444;
    transition: background 0.4s;
  }
  #status-dot.connected    { background: #4a9; }
  #status-dot.disconnected { background: #944; }

  /* ── Login screen ─────────────────────────────────────────────────── */
  #login-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }

  #login-label {
    color: #666;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  #login-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  #pw-input {
    background: #111;
    border: 1px solid #333;
    color: #e0e0e0;
    font-family: inherit;
    font-size: 14px;
    padding: 8px 12px;
    width: 220px;
    outline: none;
    transition: border-color 0.2s;
  }

  #pw-input:focus { border-color: #666; }

  #pw-input.error {
    border-color: #944;
    animation: shake 0.35s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-6px); }
    40%       { transform: translateX(6px); }
    60%       { transform: translateX(-4px); }
    80%       { transform: translateX(4px); }
  }

  #connect-btn {
    background: none;
    border: 1px solid #333;
    color: #888;
    font-family: inherit;
    font-size: 13px;
    padding: 6px 20px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: border-color 0.2s, color 0.2s;
  }

  #connect-btn:hover { border-color: #666; color: #ccc; }

  #login-error {
    color: #944;
    font-size: 12px;
    min-height: 16px;
  }

  /* ── Chat screen ──────────────────────────────────────────────────── */
  #chat-screen {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  /* Scrollbar styling */
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

  /* ── Message bubbles ──────────────────────────────────────────────── */
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 72%;
    position: relative;
  }

  .msg.user  { align-self: flex-end; align-items: flex-end; }
  .msg.bot   { align-self: flex-start; align-items: flex-start; }

  .msg-text {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.55;
  }

  .msg.user .msg-text { color: #aaaaaa; }
  .msg.bot  .msg-text { color: #e0e0e0; }

  .msg-prefix {
    margin-right: 4px;
    color: #555;
    user-select: none;
  }

  .msg-row {
    display: flex;
    align-items: flex-start;
  }

  .msg.user .msg-row { flex-direction: row-reverse; }
  .msg.user .msg-prefix { margin-right: 0; margin-left: 4px; }

  .msg-time {
    font-size: 10px;
    color: #444;
    opacity: 0;
    transition: opacity 0.2s;
    margin-top: 3px;
    user-select: none;
  }

  .msg:hover .msg-time { opacity: 1; }

  /* ── Typing indicator ─────────────────────────────────────────────── */
  #typing-indicator {
    display: none;
    align-self: flex-start;
    color: #555;
    font-size: 13px;
    padding-left: 2px;
    animation: fade-typing 1.4s ease-in-out infinite;
  }

  @keyframes fade-typing {
    0%, 100% { opacity: 0.3; }
    50%       { opacity: 0.9; }
  }

  /* ── Input area ───────────────────────────────────────────────────── */
  #input-area {
    display: flex;
    align-items: center;
    border-top: 1px solid #1a1a1a;
    padding: 10px 16px;
    gap: 10px;
    flex-shrink: 0;
  }

  #msg-input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid #333;
    color: #e0e0e0;
    font-family: inherit;
    font-size: 14px;
    padding: 4px 0;
    outline: none;
    resize: none;
    min-height: 26px;
    max-height: 120px;
    line-height: 1.4;
  }

  #msg-input::placeholder { color: #333; }
  #msg-input:focus { border-bottom-color: #555; }
  #msg-input:disabled { opacity: 0.4; cursor: not-allowed; }

  #send-btn {
    background: none;
    border: none;
    color: #666;
    font-family: inherit;
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    transition: color 0.2s;
    flex-shrink: 0;
  }

  #send-btn:hover:not(:disabled) { color: #aaa; }
  #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
</style>
</head>
<body>

<!-- Top bar (always visible) -->
<div id="topbar">
  <span id="topbar-title">redacted-chan_<span id="cursor"></span></span>
  <span id="status-dot" title="connection status"></span>
</div>

<!-- Login screen -->
<div id="login-screen">
  <div id="login-label">authenticate</div>
  <form id="login-form" onsubmit="doLogin(event)">
    <input id="pw-input" type="password" placeholder="password" autocomplete="current-password" />
    <button id="connect-btn" type="submit">connect</button>
    <div id="login-error"></div>
  </form>
</div>

<!-- Chat screen -->
<div id="chat-screen">
  <div id="messages">
    <div id="typing-indicator">...</div>
  </div>
  <div id="input-area">
    <textarea id="msg-input" rows="1" placeholder="_" maxlength="2000"></textarea>
    <button id="send-btn" onclick="sendMessage()" title="send">→</button>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────

const TOKEN_KEY = 'rc_token';
let token = localStorage.getItem(TOKEN_KEY);
let sessionId = '';
let history = [];         // [{role, content}, ...] — last 10 turns sent to API
let waitingForReply = false;

// ── DOM refs ─────────────────────────────────────────────────────────────────

const loginScreen   = document.getElementById('login-screen');
const chatScreen    = document.getElementById('chat-screen');
const pwInput       = document.getElementById('pw-input');
const loginError    = document.getElementById('login-error');
const messages      = document.getElementById('messages');
const typingEl      = document.getElementById('typing-indicator');
const msgInput      = document.getElementById('msg-input');
const sendBtn       = document.getElementById('send-btn');
const statusDot     = document.getElementById('status-dot');

// ── Init ──────────────────────────────────────────────────────────────────────

if (token) {
  showChat(true);
} else {
  showLogin();
}

// ── Auth ─────────────────────────────────────────────────────────────────────

function showLogin() {
  loginScreen.style.display = 'flex';
  chatScreen.style.display  = 'none';
  setStatus('disconnected');
  setTimeout(() => pwInput.focus(), 50);
}

function showChat(skipGreeting) {
  loginScreen.style.display = 'none';
  chatScreen.style.display  = 'flex';
  if (!skipGreeting) {
    appendBot('connecting...');
    setTimeout(() => {
      // Replace the connecting message with a prompt underscore
      const msgs = messages.querySelectorAll('.msg.bot');
      const last = msgs[msgs.length - 1];
      if (last) last.querySelector('.msg-text').textContent = '_';
      setStatus('connected');
    }, 700);
  } else {
    setStatus('connected');
  }
  setTimeout(() => msgInput.focus(), 80);
}

async function doLogin(e) {
  e.preventDefault();
  const pw = pwInput.value;
  loginError.textContent = '';
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    if (res.ok) {
      const data = await res.json();
      token = data.token;
      localStorage.setItem(TOKEN_KEY, token);
      pwInput.value = '';
      showChat(false);
    } else {
      // Wrong password — shake + flash
      loginError.textContent = 'access denied';
      pwInput.classList.remove('error');
      void pwInput.offsetWidth; // reflow to restart animation
      pwInput.classList.add('error');
      setTimeout(() => pwInput.classList.remove('error'), 400);
      pwInput.select();
    }
  } catch (err) {
    loginError.textContent = 'connection error';
  }
}

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  token = null;
  history = [];
  sessionId = '';
  // Clear messages
  const keep = messages.querySelector('#typing-indicator');
  while (messages.firstChild) messages.removeChild(messages.firstChild);
  messages.appendChild(typingEl);
  showLogin();
}

// ── Chat ─────────────────────────────────────────────────────────────────────

function setStatus(state) {
  statusDot.className = state;
}

function ts() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function appendMsg(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const row = document.createElement('div');
  row.className = 'msg-row';

  const prefix = document.createElement('span');
  prefix.className = 'msg-prefix';
  prefix.textContent = role === 'user' ? '>' : ' ';

  const textEl = document.createElement('span');
  textEl.className = 'msg-text';
  textEl.textContent = text;

  row.appendChild(prefix);
  row.appendChild(textEl);

  const timeEl = document.createElement('div');
  timeEl.className = 'msg-time';
  timeEl.textContent = ts();

  div.appendChild(row);
  div.appendChild(timeEl);

  // Insert before typing indicator
  messages.insertBefore(div, typingEl);
  scrollBottom();
  return div;
}

function appendUser(text) { return appendMsg('user', text); }
function appendBot(text)  { return appendMsg('bot', text); }

function scrollBottom() {
  messages.scrollTop = messages.scrollHeight;
}

function setWaiting(v) {
  waitingForReply = v;
  typingEl.style.display = v ? 'block' : 'none';
  msgInput.disabled = v;
  sendBtn.disabled  = v;
  if (v) scrollBottom();
}

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || waitingForReply) return;

  msgInput.value = '';
  autoResize();
  appendUser(text);

  // Maintain history (last 10 turns = 20 messages)
  history.push({ role: 'user', content: text });
  if (history.length > 20) history = history.slice(-20);

  setWaiting(true);
  setStatus('connected');

  try {
    const controller = new AbortController();
    const fetchTimeout = setTimeout(() => controller.abort(), 95000);

    const res = await fetch('/chat', {
      method: 'POST',
      signal: controller.signal,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`,
      },
      body: JSON.stringify({
        message: text,
        session_id: sessionId,
        history: history.slice(0, -1),  // history excluding the just-added message
      }),
    });
    clearTimeout(fetchTimeout);

    if (res.status === 401) {
      logout();
      return;
    }

    if (res.status === 429) {
      setWaiting(false);
      appendBot('(slow down — too many messages)');
      return;
    }

    if (!res.ok) {
      setWaiting(false);
      appendBot('(she seems unavailable right now)');
      setStatus('disconnected');
      return;
    }

    const data = await res.json();
    if (data.error) {
      setWaiting(false);
      appendBot('(she seems unavailable right now)');
      setStatus('disconnected');
      return;
    }

    sessionId = data.session_id || sessionId;
    const reply = data.response || '';
    setWaiting(false);
    appendBot(reply);
    setStatus('connected');

    // Add assistant reply to history
    history.push({ role: 'assistant', content: reply });
    if (history.length > 20) history = history.slice(-20);

  } catch (err) {
    setWaiting(false);
    if (err.name === 'AbortError') {
      appendBot('(she took too long to respond — try again)');
    } else {
      appendBot('(connection lost)');
    }
    setStatus('disconnected');
  }
}

// ── Input handling ────────────────────────────────────────────────────────────

function autoResize() {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
}

msgInput.addEventListener('input', autoResize);

msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
</body>
</html>
