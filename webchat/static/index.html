<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>redacted-chan</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0d0d;
    --sidebar:   #111111;
    --surface:   #1a1a1a;
    --surface2:  #222222;
    --border:    rgba(255,255,255,0.06);
    --text:      #e8e8e8;
    --text-dim:  #888;
    --text-muted:#555;
    --bubble-her:#1e1e1e;
    --bubble-me: #2a2a3a;
    --accent:    #6b6bcc;
    --accent-dim:#3a3a6a;
    --green:     #3dba6a;
    --red:       #e05555;
    --radius:    18px;
    --sidebar-w: 260px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', 'Courier New', monospace;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; }

  /* ── Login overlay ── */
  #login-screen {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  #login-screen.hidden { display: none; }

  .login-box {
    width: 320px;
    display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  .login-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--surface2);
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; user-select: none;
  }
  .login-name {
    font-size: 18px; font-weight: 600; color: var(--text);
    letter-spacing: -0.02em;
  }
  .login-sub {
    font-size: 12px; color: var(--text-dim); margin-top: -18px;
  }
  .login-field {
    width: 100%; position: relative;
  }
  .login-field input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 14px;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s;
  }
  .login-field input:focus { border-color: var(--accent); }
  .login-field input.error {
    border-color: var(--red);
    animation: shake 0.35s ease;
  }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
  }
  .login-btn {
    width: 100%;
    background: var(--accent);
    border: none; border-radius: 12px;
    padding: 12px;
    color: #fff;
    font-size: 14px; font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .login-btn:hover { background: #7c7cdd; }
  .login-btn:active { transform: scale(0.98); }

  /* ── App shell ── */
  #app {
    height: 100vh;
    display: flex;
  }
  #app.hidden { display: none; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .sidebar-title { font-size: 15px; font-weight: 600; flex: 1; }
  .sidebar-title span { color: var(--text-dim); font-weight: 400; }

  .contact-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .contact-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    cursor: pointer;
    border-radius: 10px;
    margin: 0 6px;
    transition: background 0.15s;
  }
  .contact-item:hover { background: var(--surface); }
  .contact-item.active { background: var(--surface2); }

  .contact-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--accent-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    position: relative;
  }
  .status-dot {
    position: absolute; bottom: 1px; right: 1px;
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--sidebar);
    background: var(--text-muted);
    transition: background 0.3s;
  }
  .status-dot.online { background: var(--green); }
  .status-dot.typing { background: var(--accent); animation: pulse 1s ease-in-out infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .contact-info { flex: 1; min-width: 0; }
  .contact-name { font-size: 13px; font-weight: 600; }
  .contact-last {
    font-size: 11px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 1px;
  }
  .contact-time { font-size: 10px; color: var(--text-muted); flex-shrink: 0; align-self: flex-start; margin-top: 2px; }

  .sidebar-footer {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .sidebar-footer-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .sidebar-footer-name { font-size: 12px; font-weight: 500; flex: 1; }
  .logout-btn {
    background: none; border: none;
    color: var(--text-muted); font-size: 16px;
    cursor: pointer; padding: 4px;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s;
  }
  .logout-btn:hover { color: var(--text); background: var(--surface); }

  /* ── Chat area ── */
  #chat-area {
    flex: 1; display: flex; flex-direction: column;
    overflow: hidden; background: var(--bg);
    position: relative;
  }

  /* Chat header */
  .chat-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    backdrop-filter: blur(8px);
  }
  .chat-header-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
  }
  .chat-header-info { flex: 1; }
  .chat-header-name { font-size: 14px; font-weight: 600; }
  .chat-header-status { font-size: 11px; color: var(--text-dim); }
  .chat-header-status.online { color: var(--green); }

  /* Messages */
  #messages {
    flex: 1; overflow-y: auto; padding: 16px 0;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

  .msg-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 16px;
    margin-bottom: 6px;
  }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .msg-row.me { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0;
    align-self: flex-end;
  }
  .msg-avatar.hidden { visibility: hidden; }

  .bubble {
    max-width: 72%;
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 13.5px;
    line-height: 1.55;
    word-break: break-word;
    position: relative;
  }

  /* Her bubbles */
  .bubble.her {
    background: var(--bubble-her);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }
  .bubble.her.tail { border-bottom-left-radius: var(--radius); }

  /* My bubbles */
  .bubble.me {
    background: var(--bubble-me);
    border: 1px solid rgba(107,107,204,0.25);
    border-bottom-right-radius: 4px;
    color: var(--text);
    text-align: left;
  }
  .bubble.me.tail { border-bottom-right-radius: var(--radius); }

  .bubble-meta {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 4px; margin-top: 3px;
  }
  .bubble-time { font-size: 10px; color: var(--text-muted); }

  /* TTS button */
  .tts-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 11px; padding: 0 2px;
    line-height: 1; opacity: 0.5; transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .tts-btn:hover { opacity: 1; }
  .tts-btn.speaking { color: var(--accent); opacity: 1; }

  /* Attachment preview strip */
  #attachment-strip {
    display: none;
    padding: 6px 14px 0;
    background: var(--bg);
  }
  #attachment-strip.visible { display: block; }
  .attachment-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 10px; font-size: 12px;
    color: var(--text-dim);
  }
  .attachment-chip button {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 13px; line-height: 1; padding: 0;
  }
  .attachment-chip button:hover { color: var(--red); }

  /* Paperclip button */
  #attach-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }
  #attach-btn:hover { background: var(--surface2); color: var(--text); }
  #attach-btn svg { width: 15px; height: 15px; }

  /* Date separator */
  .date-sep {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding: 10px 16px;
    position: relative;
  }
  .date-sep::before, .date-sep::after {
    content: '';
    position: absolute;
    top: 50%; width: calc(50% - 50px);
    height: 1px; background: var(--border);
  }
  .date-sep::before { left: 16px; }
  .date-sep::after { right: 16px; }

  /* Typing indicator */
  #typing-row {
    display: none;
    align-items: flex-end;
    gap: 8px;
    padding: 0 16px;
    margin-bottom: 6px;
  }
  #typing-row.visible { display: flex; }
  .typing-bubble {
    background: var(--bubble-her);
    border: 1px solid var(--border);
    border-radius: var(--radius); border-bottom-left-radius: 4px;
    padding: 10px 14px;
    display: flex; gap: 4px; align-items: center;
  }
  .typing-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: typing-bounce 1.4s ease-in-out infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing-bounce {
    0%,60%,100%{transform:translateY(0);opacity:.5}
    30%{transform:translateY(-5px);opacity:1}
  }

  /* Input area */
  .input-area {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg);
    display: flex; align-items: flex-end; gap: 8px;
  }
  #msg-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 9px 14px;
    color: var(--text);
    font-size: 13.5px;
    font-family: var(--font);
    outline: none;
    resize: none;
    max-height: 120px;
    overflow-y: auto;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  #msg-input:focus { border-color: rgba(107,107,204,0.4); }
  #msg-input::placeholder { color: var(--text-muted); }
  #msg-input::-webkit-scrollbar { width: 3px; }
  #msg-input::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

  #send-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--accent);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s, opacity 0.15s;
  }
  #send-btn:hover:not(:disabled) { background: #7c7cdd; }
  #send-btn:active:not(:disabled) { transform: scale(0.92); }
  #send-btn:disabled { opacity: 0.35; cursor: default; }
  #send-btn svg { width: 16px; height: 16px; }

  /* Empty state */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--text-muted); gap: 10px;
    font-size: 13px;
  }
  .empty-state .icon { font-size: 36px; opacity: 0.3; }

  /* ── Privacy panel ── */
  #privacy-panel {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: flex-start; justify-content: flex-end;
    pointer-events: none;
  }
  #privacy-panel.hidden { display: none; }

  .privacy-backdrop {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.4);
    pointer-events: all;
  }

  .privacy-drawer {
    position: relative; z-index: 1;
    width: 300px; height: 100vh;
    background: var(--sidebar);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    pointer-events: all;
    overflow-y: auto;
  }

  .privacy-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .privacy-header-title { font-size: 14px; font-weight: 600; flex: 1; }
  .privacy-close {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 18px; line-height: 1; padding: 2px 4px;
    border-radius: 6px; transition: color 0.15s, background 0.15s;
  }
  .privacy-close:hover { color: var(--text); background: var(--surface); }

  .privacy-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 20px; }

  .privacy-section { display: flex; flex-direction: column; gap: 10px; }
  .privacy-section-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-muted);
  }

  .mode-grid { display: flex; flex-direction: column; gap: 6px; }
  .mode-option {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: var(--surface);
    transition: border-color 0.15s, background 0.15s;
  }
  .mode-option:hover { background: var(--surface2); }
  .mode-option.selected { border-color: var(--accent); background: var(--accent-dim); }
  .mode-option input[type=radio] { display: none; }
  .mode-icon { font-size: 18px; flex-shrink: 0; width: 24px; text-align: center; }
  .mode-text { flex: 1; }
  .mode-name { font-size: 12px; font-weight: 600; }
  .mode-desc { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-label { font-size: 13px; }
  .toggle-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

  .toggle-switch {
    position: relative; width: 38px; height: 22px; flex-shrink: 0;
  }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0; cursor: pointer;
    background: var(--surface2); border-radius: 22px;
    border: 1px solid var(--border);
    transition: background 0.2s;
  }
  .toggle-slider:before {
    content: ''; position: absolute;
    width: 16px; height: 16px; left: 2px; top: 2px;
    background: var(--text-muted); border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle-switch input:checked + .toggle-slider { background: var(--accent-dim); border-color: var(--accent); }
  .toggle-switch input:checked + .toggle-slider:before { transform: translateX(16px); background: var(--accent); }

  .log-level-row { display: flex; gap: 6px; }
  .log-chip {
    flex: 1; padding: 6px 0; text-align: center;
    font-size: 11px; font-weight: 600; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; color: var(--text-dim);
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .log-chip.selected { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }

  .privacy-status {
    font-size: 11px; color: var(--text-muted);
    text-align: center; padding: 8px 0 0;
  }
  .privacy-status.ok { color: var(--green); }
  .privacy-status.err { color: var(--red); }

  /* Shield button in header */
  .shield-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 15px; padding: 4px 6px;
    border-radius: 8px; transition: color 0.15s, background 0.15s;
    line-height: 1;
  }
  .shield-btn:hover { color: var(--text); background: var(--surface); }
  .shield-btn.active { color: var(--accent); }

  /* Responsive */
  @media (max-width: 640px) {
    #sidebar { display: none; }
    .bubble { max-width: 85%; }
    .privacy-drawer { width: 100vw; }
  }
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-avatar">✦</div>
    <div style="text-align:center">
      <div class="login-name">redacted-chan</div>
      <div class="login-sub" style="margin-top:4px">private · end-to-end</div>
    </div>
    <div class="login-field">
      <input type="password" id="pw-input" placeholder="passphrase" autocomplete="current-password" />
    </div>
    <button class="login-btn" id="login-btn">Connect</button>
  </div>
</div>

<!-- ── Privacy panel ── -->
<div id="privacy-panel" class="hidden">
  <div class="privacy-backdrop" id="privacy-backdrop"></div>
  <div class="privacy-drawer">
    <div class="privacy-header">
      <span style="font-size:16px">🛡</span>
      <div class="privacy-header-title">Privacy Controls</div>
      <button class="privacy-close" id="privacy-close">✕</button>
    </div>
    <div class="privacy-body">

      <div class="privacy-section">
        <div class="privacy-section-label">Mode</div>
        <div class="mode-grid" id="mode-grid">
          <label class="mode-option" data-mode="anonymous">
            <input type="radio" name="privacy_mode" value="anonymous">
            <div class="mode-icon">🌐</div>
            <div class="mode-text">
              <div class="mode-name">Anonymous</div>
              <div class="mode-desc">Strip fingerprints · synthetic UA · full logs</div>
            </div>
          </label>
          <label class="mode-option" data-mode="private">
            <input type="radio" name="privacy_mode" value="private">
            <div class="mode-icon">🔒</div>
            <div class="mode-text">
              <div class="mode-name">Private</div>
              <div class="mode-desc">No content in logs · metadata only</div>
            </div>
          </label>
          <label class="mode-option" data-mode="maximum">
            <input type="radio" name="privacy_mode" value="maximum">
            <div class="mode-icon">⛔</div>
            <div class="mode-text">
              <div class="mode-name">Maximum</div>
              <div class="mode-desc">Minimal logs · PII scrub · strongest posture</div>
            </div>
          </label>
        </div>
      </div>

      <div class="privacy-section">
        <div class="privacy-section-label">Log Level</div>
        <div class="log-level-row" id="log-level-row">
          <div class="log-chip" data-level="full">Full</div>
          <div class="log-chip" data-level="minimal">Minimal</div>
          <div class="log-chip" data-level="none">None</div>
        </div>
      </div>

      <div class="privacy-section">
        <div class="privacy-section-label">Options</div>
        <div class="toggle-row">
          <div>
            <div class="toggle-label">PII Scrubbing</div>
            <div class="toggle-sub">Redact IDs, emails, @handles before forwarding</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-scrub">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <div>
            <div class="toggle-label">Ephemeral Mode</div>
            <div class="toggle-sub">Disable all logging globally for every request</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-ephemeral">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <div class="privacy-status" id="privacy-status">loading…</div>
    </div>
  </div>
</div>

<!-- ── App ── -->
<div id="app" class="hidden">

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Messages</div>
    </div>
    <div class="contact-list">
      <div class="contact-item active" id="contact-item">
        <div class="contact-avatar">
          ✦
          <div class="status-dot" id="status-dot"></div>
        </div>
        <div class="contact-info">
          <div class="contact-name">redacted-chan</div>
          <div class="contact-last" id="last-msg-preview">—</div>
        </div>
        <div class="contact-time" id="last-msg-time"></div>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-footer-avatar">◈</div>
      <div class="sidebar-footer-name">master</div>
      <button class="logout-btn" id="logout-btn" title="Disconnect">⏻</button>
    </div>
  </div>

  <!-- Chat area -->
  <div id="chat-area">
    <div class="chat-header">
      <div class="chat-header-avatar">✦</div>
      <div class="chat-header-info">
        <div class="chat-header-name">redacted-chan</div>
        <div class="chat-header-status" id="header-status">connecting...</div>
      </div>
      <button class="shield-btn" id="shield-btn" title="Privacy controls">🛡</button>
    </div>

    <div id="messages"></div>

    <!-- Typing indicator row -->
    <div id="typing-row">
      <div class="msg-avatar">✦</div>
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>

    <div id="attachment-strip"></div>
    <div class="input-area">
      <input type="file" id="file-input" accept=".txt,.md,.pdf,.py,.js,.ts,.json,.csv,.jpg,.jpeg,.png,.gif,.webp" style="display:none">
      <button id="attach-btn" title="Attach file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <textarea id="msg-input" rows="1" placeholder="Message redacted-chan..." maxlength="4000"></textarea>
      <button id="send-btn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
'use strict';

// ── State ────────────────────────────────────────────────────────────────────
let token           = localStorage.getItem('rc_token') || '';
let sessionId       = localStorage.getItem('rc_session') || '';
let history         = [];   // [{role,content}] for API
let waiting         = false;
let msgCount        = 0;
let attachmentText  = '';   // extracted file text
let attachmentName  = '';   // filename for display
let attachmentImage = '';   // base64 data URL for image attachments
let ttsActive       = null; // currently speaking button element

// ── DOM refs ──────────────────────────────────────────────────────────────────
const loginScreen  = document.getElementById('login-screen');
const app          = document.getElementById('app');
const pwInput      = document.getElementById('pw-input');
const loginBtn     = document.getElementById('login-btn');
const messagesEl   = document.getElementById('messages');
const typingRow    = document.getElementById('typing-row');
const msgInput     = document.getElementById('msg-input');
const sendBtn      = document.getElementById('send-btn');
const statusDot    = document.getElementById('status-dot');
const headerStatus = document.getElementById('header-status');
const lastPreview  = document.getElementById('last-msg-preview');
const lastTime     = document.getElementById('last-msg-time');
const logoutBtn    = document.getElementById('logout-btn');

// ── Helpers ───────────────────────────────────────────────────────────────────
function timeStr(d) {
  d = d || new Date();
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function dateStr(d) {
  const now = new Date();
  const diff = now - d;
  if (diff < 86400000 && now.getDate() === d.getDate()) return 'Today';
  if (diff < 172800000) return 'Yesterday';
  return d.toLocaleDateString([], {month:'long', day:'numeric'});
}

function setStatus(s) {
  if (s === 'online') {
    statusDot.className = 'status-dot online';
    headerStatus.textContent = 'online';
    headerStatus.className = 'chat-header-status online';
  } else if (s === 'typing') {
    statusDot.className = 'status-dot typing';
    headerStatus.textContent = 'typing...';
    headerStatus.className = 'chat-header-status';
  } else {
    statusDot.className = 'status-dot';
    headerStatus.textContent = s === 'connecting' ? 'connecting...' : 'last seen recently';
    headerStatus.className = 'chat-header-status';
  }
}

function setWaiting(v) {
  waiting = v;
  sendBtn.disabled = v || msgInput.value.trim() === '';
  typingRow.className = v ? 'visible' : '';
  if (v) {
    setStatus('typing');
    // Scroll typing indicator into view
    typingRow.scrollIntoView({behavior:'smooth', block:'end'});
  } else {
    setStatus('online');
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Simple markdown-like formatting: **bold**, *italic*, `code`, line breaks
function formatText(s) {
  let h = escHtml(s);
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
  h = h.replace(/`(.+?)`/g, '<code style="background:rgba(255,255,255,0.08);padding:1px 5px;border-radius:4px;font-family:var(--font-mono);font-size:12px">$1</code>');
  h = h.replace(/\n/g, '<br>');
  return h;
}

let _lastDateSep = '';
let _lastSender  = '';

function appendMessage(role, content, opts = {}) {
  const isMe = role === 'user';
  const now  = opts.time || new Date();
  const ts   = timeStr(now);
  const ds   = dateStr(now);

  // Date separator
  if (ds !== _lastDateSep) {
    _lastDateSep = ds;
    _lastSender  = '';
    const sep = document.createElement('div');
    sep.className = 'date-sep';
    sep.textContent = ds;
    messagesEl.appendChild(sep);
  }

  // Group same-sender consecutive bubbles
  const sameSender = (_lastSender === role);
  _lastSender = role;

  const row = document.createElement('div');
  row.className = 'msg-row' + (isMe ? ' me' : '');

  const avatarEl = document.createElement('div');
  avatarEl.className = 'msg-avatar' + (sameSender ? ' hidden' : '');
  avatarEl.textContent = isMe ? '◈' : '✦';

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (isMe ? 'me' : 'her') + (sameSender ? '' : ' tail');

  const textDiv = document.createElement('div');
  textDiv.innerHTML = formatText(content);

  const meta = document.createElement('div');
  meta.className = 'bubble-meta';
  const timeEl = document.createElement('span');
  timeEl.className = 'bubble-time';
  timeEl.textContent = ts;
  meta.appendChild(timeEl);

  // TTS button on assistant messages
  if (!isMe) {
    const ttsBtn = document.createElement('button');
    ttsBtn.className = 'tts-btn';
    ttsBtn.title = 'Read aloud';
    ttsBtn.textContent = '🔊';
    ttsBtn.addEventListener('click', () => toggleTTS(ttsBtn, content));
    meta.insertBefore(ttsBtn, timeEl);
  }

  bubble.appendChild(textDiv);
  bubble.appendChild(meta);
  row.appendChild(avatarEl);
  row.appendChild(bubble);

  const group = document.createElement('div');
  group.className = 'msg-group';
  group.appendChild(row);
  messagesEl.appendChild(group);

  // Update sidebar preview
  const preview = content.length > 38 ? content.slice(0, 38) + '…' : content;
  lastPreview.textContent = (isMe ? 'you: ' : '') + preview;
  lastTime.textContent = ts;

  // Scroll to bottom
  messagesEl.scrollTop = messagesEl.scrollHeight;
  msgCount++;
}

function appendSystem(text) {
  const div = document.createElement('div');
  div.style.cssText = 'text-align:center;font-size:11px;color:var(--text-muted);padding:8px 16px';
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  _lastSender = '';
}

// ── TTS ───────────────────────────────────────────────────────────────────────
function toggleTTS(btn, text) {
  if (ttsActive === btn) {
    speechSynthesis.cancel();
    ttsActive = null;
    btn.classList.remove('speaking');
    return;
  }
  if (ttsActive) {
    speechSynthesis.cancel();
    ttsActive.classList.remove('speaking');
  }
  const clean = text.replace(/[*_`#>]/g, '').replace(/\n/g, ' ');
  const utt = new SpeechSynthesisUtterance(clean);
  const voices = speechSynthesis.getVoices();
  const preferred = voices.find(v => v.lang.startsWith('en') && /female|zira|samantha|victoria/i.test(v.name))
                 || voices.find(v => v.lang.startsWith('en'))
                 || voices[0];
  if (preferred) utt.voice = preferred;
  utt.rate = 0.95;
  utt.onend = () => { ttsActive = null; btn.classList.remove('speaking'); };
  utt.onerror = () => { ttsActive = null; btn.classList.remove('speaking'); };
  ttsActive = btn;
  btn.classList.add('speaking');
  speechSynthesis.speak(utt);
}

// ── File attach ───────────────────────────────────────────────────────────────
const attachStrip = document.getElementById('attachment-strip');
const fileInput   = document.getElementById('file-input');
const attachBtn   = document.getElementById('attach-btn');

attachBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  fileInput.value = '';

  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch('/upload', {
      method: 'POST',
      headers: {'Authorization': `Bearer ${token}`},
      body: fd,
    });
    if (!res.ok) { appendSystem('upload failed'); return; }
    const data = await res.json();
    attachmentName = data.filename || file.name;
    if (data.type === 'image') {
      attachmentImage = data.data_url || '';
      attachmentText  = '';
    } else {
      attachmentText  = data.text || '';
      attachmentImage = '';
    }
    showAttachment(data.type === 'image' ? attachmentImage : null);
  } catch {
    appendSystem('upload failed');
  }
});

function showAttachment(dataUrl) {
  attachStrip.innerHTML = '';
  const chip = document.createElement('div');
  chip.className = 'attachment-chip';
  if (dataUrl) {
    // Image preview
    chip.innerHTML = `<img src="${dataUrl}" style="height:40px;border-radius:4px;object-fit:cover"> ${escHtml(attachmentName)} <button onclick="clearAttachment()" title="Remove">✕</button>`;
  } else {
    chip.innerHTML = `📎 ${escHtml(attachmentName)} <button onclick="clearAttachment()" title="Remove">✕</button>`;
  }
  attachStrip.appendChild(chip);
  attachStrip.classList.add('visible');
}

function clearAttachment() {
  attachmentText  = '';
  attachmentName  = '';
  attachmentImage = '';
  attachStrip.innerHTML = '';
  attachStrip.classList.remove('visible');
}

// ── Login ─────────────────────────────────────────────────────────────────────
async function doLogin() {
  const pw = pwInput.value.trim();
  if (!pw) return;
  loginBtn.disabled = true;
  loginBtn.textContent = 'Connecting…';
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({password: pw}),
    });
    const data = await res.json();
    if (!res.ok) {
      pwInput.classList.add('error');
      setTimeout(() => pwInput.classList.remove('error'), 400);
      pwInput.value = '';
      pwInput.focus();
      loginBtn.disabled = false;
      loginBtn.textContent = 'Connect';
      return;
    }
    token = data.token;
    localStorage.setItem('rc_token', token);
    showApp();
  } catch {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Connect';
  }
}

loginBtn.addEventListener('click', doLogin);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ── Logout ────────────────────────────────────────────────────────────────────
function logout() {
  token = '';
  localStorage.removeItem('rc_token');
  localStorage.removeItem('rc_session');
  messagesEl.innerHTML = '';
  history = [];
  _lastDateSep = ''; _lastSender = '';
  app.classList.add('hidden');
  loginScreen.classList.remove('hidden');
  pwInput.value = '';
  setTimeout(() => pwInput.focus(), 50);
}
logoutBtn.addEventListener('click', logout);

// ── Show app ──────────────────────────────────────────────────────────────────
function showApp() {
  loginScreen.classList.add('hidden');
  app.classList.remove('hidden');
  setStatus('connecting');
  appendSystem('establishing connection…');
  setTimeout(() => {
    setStatus('online');
    // Replace "establishing" note with empty
    const notes = messagesEl.querySelectorAll('div[style]');
    notes.forEach(n => n.remove());
    sendBtn.disabled = false;
    setTimeout(() => msgInput.focus(), 50);
  }, 600);
}

// ── Auto-resize textarea ──────────────────────────────────────────────────────
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  sendBtn.disabled = waiting || msgInput.value.trim() === '';
});

msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!waiting && msgInput.value.trim()) sendMessage();
  }
});

sendBtn.addEventListener('click', () => {
  if (!waiting && msgInput.value.trim()) sendMessage();
});

// ── Send message ──────────────────────────────────────────────────────────────
async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || waiting) return;

  msgInput.value = '';
  msgInput.style.height = 'auto';
  sendBtn.disabled = true;

  // Prepend any attached file text; capture image before clearing
  const fullText = attachmentText
    ? `[Attached file: ${attachmentName}]\n${attachmentText}\n\n${text}`
    : text;
  const imageData = attachmentImage;
  clearAttachment();

  appendMessage('user', text);
  history.push({role: 'user', content: fullText});

  setWaiting(true);

  const controller = new AbortController();
  const abortTimer = setTimeout(() => controller.abort(), 95000);

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      signal: controller.signal,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`,
      },
      body: JSON.stringify({
        message: fullText,
        session_id: sessionId,
        history: history.slice(0, -1),
        image_data: imageData,
      }),
    });
    clearTimeout(abortTimer);

    if (res.status === 401) { logout(); return; }

    setWaiting(false);

    if (res.status === 429) {
      appendSystem('slow down — too many messages');
      return;
    }

    if (!res.ok) {
      appendSystem('she seems unavailable right now');
      setStatus('offline');
      return;
    }

    const data = await res.json();
    if (data.error) {
      appendSystem('she seems unavailable right now');
      return;
    }

    sessionId = data.session_id || sessionId;
    localStorage.setItem('rc_session', sessionId);

    const reply = data.response || '';
    appendMessage('assistant', reply);
    history.push({role: 'assistant', content: reply});
    if (history.length > 20) history = history.slice(-20);

  } catch (err) {
    clearTimeout(abortTimer);
    setWaiting(false);
    if (err.name === 'AbortError') {
      appendSystem('she took a while — try again');
    } else {
      appendSystem('connection lost');
      setStatus('offline');
    }
  }
}

// ── Privacy panel ────────────────────────────────────────────────────────────
const privacyPanel    = document.getElementById('privacy-panel');
const privacyBackdrop = document.getElementById('privacy-backdrop');
const privacyClose    = document.getElementById('privacy-close');
const privacyStatus   = document.getElementById('privacy-status');
const shieldBtn       = document.getElementById('shield-btn');
const toggleScrub     = document.getElementById('toggle-scrub');
const toggleEphemeral = document.getElementById('toggle-ephemeral');

let _privacyCfg = null;   // last known config from proxy
let _privacySaving = false;

function openPrivacyPanel() {
  privacyPanel.classList.remove('hidden');
  shieldBtn.classList.add('active');
  loadPrivacyConfig();
}

function closePrivacyPanel() {
  privacyPanel.classList.add('hidden');
  shieldBtn.classList.remove('active');
}

shieldBtn.addEventListener('click', openPrivacyPanel);
privacyClose.addEventListener('click', closePrivacyPanel);
privacyBackdrop.addEventListener('click', closePrivacyPanel);

function _renderConfig(cfg) {
  _privacyCfg = cfg;

  // Mode options
  document.querySelectorAll('.mode-option').forEach(el => {
    el.classList.toggle('selected', el.dataset.mode === cfg.privacy_mode);
  });

  // Log level chips
  document.querySelectorAll('.log-chip').forEach(el => {
    el.classList.toggle('selected', el.dataset.level === cfg.log_level);
  });

  // Toggles
  toggleScrub.checked     = !!cfg.privacy_scrub;
  toggleEphemeral.checked = !!cfg.ephemeral_mode;

  privacyStatus.textContent = '● synced';
  privacyStatus.className   = 'privacy-status ok';
}

async function loadPrivacyConfig() {
  privacyStatus.textContent = 'loading…';
  privacyStatus.className   = 'privacy-status';
  try {
    const res = await fetch('/proxy-config', {
      headers: {'Authorization': `Bearer ${token}`},
    });
    if (res.status === 503) {
      privacyStatus.textContent = 'proxy not reachable';
      privacyStatus.className   = 'privacy-status err';
      return;
    }
    const cfg = await res.json();
    _renderConfig(cfg);
  } catch {
    privacyStatus.textContent = 'could not load config';
    privacyStatus.className   = 'privacy-status err';
  }
}

async function savePrivacyConfig(patch) {
  if (_privacySaving) return;
  _privacySaving = true;
  privacyStatus.textContent = 'saving…';
  privacyStatus.className   = 'privacy-status';
  try {
    const res = await fetch('/proxy-config', {
      method: 'POST',
      headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'},
      body: JSON.stringify(patch),
    });
    const data = await res.json();
    if (data.current) {
      _renderConfig(data.current);
    } else if (data.error) {
      privacyStatus.textContent = data.error;
      privacyStatus.className   = 'privacy-status err';
    }
  } catch {
    privacyStatus.textContent = 'save failed';
    privacyStatus.className   = 'privacy-status err';
  } finally {
    _privacySaving = false;
  }
}

// Mode selection
document.querySelectorAll('.mode-option').forEach(el => {
  el.addEventListener('click', () => {
    savePrivacyConfig({privacy_mode: el.dataset.mode});
  });
});

// Log level chips
document.querySelectorAll('.log-chip').forEach(el => {
  el.addEventListener('click', () => {
    savePrivacyConfig({log_level: el.dataset.level});
  });
});

// Toggles
toggleScrub.addEventListener('change', () => {
  savePrivacyConfig({privacy_scrub: toggleScrub.checked});
});
toggleEphemeral.addEventListener('change', () => {
  savePrivacyConfig({ephemeral_mode: toggleEphemeral.checked});
});

// ── Init ──────────────────────────────────────────────────────────────────────
if (token) {
  showApp();
} else {
  setTimeout(() => pwInput.focus(), 50);
}
</script>
</body>
</html>
