[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-core"
version = "0.1.0"
description = "Shared library for the REDACTED AI swarm: committee deliberation, BEAM-SCoT, hyperbolic kernel, lore vault, agent registry."
requires-python = ">=3.11"
# Consolidated from the three dependency systems this package replaces:
# the repo-root requirements.txt, requirements/{base,bot,core_llm,dev,opt}.txt,
# and python/requirements.txt. Only what swarm_core itself imports lives here;
# per-service extras stay with the service.
dependencies = [
    # The {7,3} hyperbolic kernel is core library code, not an extra — CI
    # caught this the first time it ran: committee_engine, engine.swarm_engine
    # and kernel.hyperbolic_kernel all fail to import without it.
    "numpy>=1.26",
    "requests>=2.31",
    "aiohttp>=3.9",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "redis>=5.0",
    # ed25519 verification for the holder gate (swarm_core.gate). Small, has
    # manylinux wheels, and a security primitive — not an optional extra.
    "cryptography>=42",
]

[project.scripts]
swarm = "swarm_core.cli:main"

[project.optional-dependencies]
# swarm_core.llm providers
llm = ["groq>=0.10", "anthropic>=0.28", "ollama>=0.3"]
# swarm_core.engine.swarm_engine's Telegram bridge
telegram = ["python-telegram-bot>=21"]
# swarm_core.mandala_client and the settlement path
solana = ["solana>=0.34", "solders>=0.21", "anchorpy>=0.19"]
# mem0-memory plugin integration (lore_vault, gnosis_*, log_ingest, docs_ingest)
memory = ["mem0ai>=0.0.1"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.21", "ruff>=0.6"]
# `swarm` CLI -> native binary (scripts/build_executables.py). The .pyz target
# needs nothing extra.
build = ["pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The x402 verification suite is async throughout; without this every test in
# it is silently skipped with an "unknown mark" warning rather than failing,
# which is the worst possible outcome for the code that guards payments.
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swarm_core = ["**/*.json", "**/*.md"]
