# swarm_core.security.authz — capability grants (IronClaw control 7).
#
# `authz.require(agent, capability)` checks `grants` here. Capabilities listed
# under `requires_approval` ALSO need a live approval token minted by the
# Sevenfold Committee route or a Telegram admin — a static grant alone is not
# enough for them.
#
# "*" in an agent's list = any capability (still subject to the approval gate).

approval_ttl: 900        # seconds an approval token stays valid once granted

# `code.exec` is NOT approval-gated: apps/exec-runner (no secrets, no network,
# rlimited) is the containment. Everything below has no equivalent containment.
#
# `funds.refuel` is deliberately NOT approval-gated: auto-refuel cannot block on
# a human. Its containment is code-enforced — RESERVE_EXECUTE off by default, a
# per-agent daily cap + cooldown, a fixed small top-up amount, and every attempt
# on the swarm:audit chain. Held only by `settler`.
requires_approval:
  - funds.transfer       # wallet / Jupiter / Solana buys
  - infra.deploy         # railway/portainer/compose changes
  - secret.read          # pulling a raw secret value
  - docker.control       # anything touching the docker socket
  - inbox.broadcast_admin
  - social.post          # outward-facing X/Twitter writes (post / reply / like)
  - workspace.shell      # apps/workspace shell: has network AND persistence

# `evolve.promote` is NOT approval-gated. Its containment is the arena in
# `swarm_core.evolve`: a candidate must beat the live body on a benchmark, add no
# new errors, fit inside the registered artifact set (text blobs only — never
# source, compose or policy), and land while EVOLVE_EXECUTE is on. Every attempt,
# kept or rejected, is on the audit chain and one call from rollback.

grants:
  hermes:            [code.exec, infra.deploy, secret.read, web.fetch, inbox.send, llm.call, social.post, workspace.shell, workspace.browse, evolve.promote]
  redactedbuilder:   [funds.transfer, web.fetch, inbox.send, llm.call]
  redactedintern:    [infra.deploy, inbox.send, llm.call]
  redactedgovimprover: [inbox.send, llm.call]
  smolting:          [web.fetch, inbox.send, llm.call, workspace.browse, evolve.promote]
  runtime:           [web.fetch, inbox.send, llm.call]
  redacted-chan:     [inbox.send, llm.call, web.fetch, workspace.browse, workspace.shell, infra.deploy, code.exec, evolve.promote]
  mandalaasettler:   [funds.transfer, inbox.send, llm.call]
  refinery:          [inbox.send, llm.call]
  degen:             [inbox.send, llm.call]
  settler:           [inbox.send, llm.call, funds.refuel]
  arb-keeper:        [inbox.send, llm.call]

# agent -> capabilities that skip the approval gate for that agent only. The
# agent still needs the static grant above. redacted-chan is a trusted private
# 1:1 companion with no outward publishing surface, so her workspace shell runs
# always-on (same ergonomics as her sandboxed python_exec). infra.deploy is
# deliberately NOT exempted — it stays approval-gated for everyone.
approval_exempt:
  redacted-chan: [workspace.shell]
