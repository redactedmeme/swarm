# swarm-refinery service block.
# Paste this `refinery:` service into /home/umbrel/swarm-infra/docker-compose.yml
# (under `services:`, alongside smolting). Uses host networking so it reaches
# postgres/redis/qdrant on 127.0.0.1, mirroring swarm-runtime/hermes.
#
# Read-only source mounts:
#   smoltingdata volume  -> /sources/smolting     (facts.db, post_tracker.json, ...)
#   hermesdata volume    -> /sources/hermes
#   redacted-chan bind   -> /sources/redacted-chan (facts.db + orchestrator *.jsonl, PRIVATE)

  refinery:
    build:
      context: /home/umbrel/swarm/refinery
      dockerfile: Dockerfile
    container_name: swarm-refinery
    env_file:
      - .env
    environment:
      REDIS_URL: redis://127.0.0.1:6379
      POSTGRES_URL: postgresql://${POSTGRES_USER:-swarm}:${POSTGRES_PASSWORD:-swarm_secret}@127.0.0.1:5432/${POSTGRES_DB:-swarm}
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: swarm_signals
      EMBED_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBED_DIM: "384"
      TOKEN_MINT: 9mtKd1o8Ht7F1daumKgs5D8EdVyopWBfYQwNmMojpump
      REFINERY_PORT: "8090"
      INGEST_INTERVAL_MIN: "30"
      REFINE_INTERVAL_MIN: "60"
      REFINERY_PRUNE: "false"          # keep OFF until ingest is verified
      SRC_SMOLTING: /sources/smolting
      SRC_HERMES: /sources/hermes
      SRC_REDACTED_CHAN: /sources/redacted-chan
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      PYTHONUNBUFFERED: "1"
    volumes:
      - smoltingdata:/sources/smolting:ro
      - hermesdata:/sources/hermes:ro
      - /home/umbrel/redacted-chan/data:/sources/redacted-chan:ro
      - refinerymodels:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    network_mode: host

