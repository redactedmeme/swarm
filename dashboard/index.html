<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDACTED Token Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: #12121a;
            --bg-card-hover: #1a1a26;
            --border: #1e1e2e;
            --text-primary: #e0e0e8;
            --text-secondary: #8888a0;
            --text-muted: #55556a;
            --accent: #7c5cfc;
            --accent-glow: rgba(124, 92, 252, 0.15);
            --green: #22c55e;
            --red: #ef4444;
            --green-dim: rgba(34, 197, 94, 0.12);
            --red-dim: rgba(239, 68, 68, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            border-bottom: 1px solid var(--border);
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header h1 span {
            color: var(--accent);
        }

        .token-addr {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .token-addr:hover { border-color: var(--accent); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .refresh-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .refresh-btn.loading {
            opacity: 0.5;
            pointer-events: none;
        }

        .last-updated {
            font-size: 11px;
            color: var(--text-muted);
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .auto-refresh input[type="checkbox"] {
            accent-color: var(--accent);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 32px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            transition: border-color 0.2s;
        }

        .stat-card:hover { border-color: var(--accent); }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 600;
        }

        .stat-sub {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .positive { color: var(--green); }
        .negative { color: var(--red); }

        .chart-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
        }

        .chart-tabs {
            display: flex;
            gap: 4px;
        }

        .chart-tab {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            transition: all 0.2s;
        }

        .chart-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .chart-tab:hover:not(.active) {
            border-color: var(--text-muted);
            color: var(--text-secondary);
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .pools-section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pool-count {
            background: var(--accent);
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .pools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 12px;
        }

        .pool-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            transition: all 0.2s;
            cursor: default;
        }

        .pool-card:hover {
            border-color: var(--accent);
            background: var(--bg-card-hover);
        }

        .pool-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .pool-pair {
            font-size: 14px;
            font-weight: 600;
        }

        .pool-dex {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-primary);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .pool-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .pool-metric-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pool-metric-value {
            font-size: 14px;
            font-weight: 500;
            margin-top: 2px;
        }

        .pool-bar-container {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .pool-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .pool-bar {
            height: 4px;
            background: var(--bg-primary);
            border-radius: 2px;
            overflow: hidden;
        }

        .pool-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.6s ease;
        }

        .pool-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 11px;
            color: var(--accent);
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .pool-link:hover { opacity: 1; }

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            color: var(--text-muted);
            gap: 12px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--red);
        }

        .error-state .retry {
            margin-top: 12px;
            color: var(--accent);
            cursor: pointer;
            font-size: 12px;
        }

        .error-state .retry:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .header { padding: 16px; }
            .container { padding: 16px; }
            .pools-grid { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .pool-metrics { grid-template-columns: repeat(2, 1fr); }
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 12px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .fee-badge {
            display: inline-block;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 3px;
            font-weight: 500;
        }

        .fee-badge.low { background: rgba(34,197,94,0.15); color: var(--green); }
        .fee-badge.mid { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .fee-badge.high { background: rgba(239,68,68,0.15); color: var(--red); }
        .fee-badge.dynamic { background: rgba(124,92,252,0.15); color: var(--accent); }

        .pool-fees-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .pool-fee-item {
            flex: 1;
        }

        .stat-value.accent { color: var(--accent); }

        .fees-summary {
            background: linear-gradient(135deg, rgba(124,92,252,0.08), rgba(124,92,252,0.02));
            border-color: rgba(124,92,252,0.25);
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <h1><span>REDACTED</span> Volume Tracker</h1>
        <span class="token-addr" id="tokenAddr" title="Click to copy">9a21gb7f...KgnM</span>
    </div>
    <div class="header-right">
        <div class="auto-refresh">
            <input type="checkbox" id="autoRefresh" checked>
            <label for="autoRefresh">Auto (30s)</label>
        </div>
        <button class="refresh-btn" id="refreshBtn" onclick="fetchData()">Refresh</button>
        <span class="last-updated" id="lastUpdated">--</span>
    </div>
</div>

<div class="container">
    <div id="statsRow" class="stats-row"></div>

    <div class="chart-section">
        <div class="chart-header">
            <span class="chart-title">Volume by Pool</span>
            <div class="chart-tabs">
                <button class="chart-tab active" data-metric="volume24h" onclick="switchChart('volume24h', this)">24h Vol</button>
                <button class="chart-tab" data-metric="volume6h" onclick="switchChart('volume6h', this)">6h Vol</button>
                <button class="chart-tab" data-metric="volume1h" onclick="switchChart('volume1h', this)">1h Vol</button>
                <button class="chart-tab" data-metric="liquidity" onclick="switchChart('liquidity', this)">Liquidity</button>
                <button class="chart-tab" data-metric="fees24h" onclick="switchChart('fees24h', this)">24h Fees</button>
            </div>
        </div>
        <div class="chart-container">
            <canvas id="volumeChart"></canvas>
        </div>
    </div>

    <div class="chart-section">
        <div class="chart-header">
            <span class="chart-title">Volume Distribution</span>
        </div>
        <div class="chart-container" style="height:260px;">
            <canvas id="pieChart"></canvas>
        </div>
    </div>

    <div class="pools-section">
        <div class="section-title">
            Active Pools <span class="pool-count" id="poolCount">0</span>
        </div>
        <div class="pools-grid" id="poolsGrid">
            <div class="loading-state">
                <div class="spinner"></div>
                <span>Fetching pool data...</span>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOKEN = '9a21gb7fWGm9dD2UFdZAzgFn5K1NwfmYkjyLbpAcKgnM';
const API_URL = `https://api.dexscreener.com/latest/dex/tokens/${TOKEN}`;

let poolsData = [];
let volumeChart = null;
let pieChart = null;
let autoRefreshInterval = null;
let currentMetric = 'volume24h';

document.getElementById('tokenAddr').addEventListener('click', () => {
    navigator.clipboard.writeText(TOKEN);
    showToast('Address copied');
});

document.getElementById('autoRefresh').addEventListener('change', (e) => {
    if (e.target.checked) startAutoRefresh();
    else stopAutoRefresh();
});

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function fmt(n) {
    if (n == null) return '--';
    if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
    return '$' + n.toFixed(2);
}

function fmtCompact(n) {
    if (n == null) return '--';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return n.toFixed(0);
}

function fmtPct(n) {
    if (n == null) return '--';
    const sign = n >= 0 ? '+' : '';
    return sign + n.toFixed(2) + '%';
}

function pctClass(n) {
    if (n == null) return '';
    return n >= 0 ? 'positive' : 'negative';
}

function poolLabel(p) {
    const base = p.baseToken?.symbol || '?';
    const quote = p.quoteToken?.symbol || '?';
    return `${base}/${quote}`;
}

function dexLabel(p) {
    return p.dexId || 'unknown';
}

let feeRatesMap = {};

// Pools not indexed by Meteora's amm-v2 API (DLMM/DYN2) — fees confirmed on-chain via app.meteora.ag
const MANUAL_FEE_OVERRIDES = {
    'BeMzNX5hMFQxc29odj4nAvaBw16zvxgSStFbFgG7SQhY': 0.01,  // REDACTED/GIGA DLMM — 1% base fee, bin step 80
    '7YhtV5K7Cg1GTz2GAfzrwBpgX6haY6sHodsFrSpif1eh': 0.01,  // REDACTED/REDACTED DLMM
    'HjfUNoFr2FY419vn2262qZ532dA2cSGMrD8skSak5J49': 0.01,  // REDACTED/LOCKIN DLMM
    '6rxMikVZW4kjNDXcUZYM9ix8CtirdL21Mnhi5kNgmxMm': 0.01,  // REDACTED/Buttcoin DYN2
};

async function fetchFeeRates() {
    for (const [addr, rate] of Object.entries(MANUAL_FEE_OVERRIDES)) {
        feeRatesMap[addr] = rate;
    }
    const byDex = {};
    for (const p of poolsData) {
        const dex = p.dexId || 'unknown';
        if (!byDex[dex]) byDex[dex] = [];
        byDex[dex].push(p);
    }

    const promises = [];

    if (byDex.raydium?.length) {
        promises.push((async () => {
            try {
                const ids = byDex.raydium.map(p => p.pairAddress).join(',');
                const r = await fetch('https://api-v3.raydium.io/pools/info/ids?ids=' + ids);
                if (!r.ok) return;
                const d = await r.json();
                for (const pool of (d.data || [])) {
                    if (pool.id && pool.feeRate != null) feeRatesMap[pool.id] = pool.feeRate;
                }
            } catch(e) {}
        })());
    }

    if (byDex.orca?.length) {
        promises.push((async () => {
            try {
                const addrs = new Set(byDex.orca.map(p => p.pairAddress));
                const r = await fetch('https://api.mainnet.orca.so/v1/whirlpool/list');
                if (!r.ok) return;
                const d = await r.json();
                for (const w of (d.whirlpools || [])) {
                    if (addrs.has(w.address) && w.lpFeeRate != null) feeRatesMap[w.address] = w.lpFeeRate;
                }
            } catch(e) {}
        })());
    }

    if (byDex.meteora?.length) {
        promises.push((async () => {
            for (const p of byDex.meteora) {
                try {
                    const r = await fetch('https://amm-v2.meteora.ag/pools?address=' + p.pairAddress);
                    if (!r.ok) continue;
                    const d = await r.json();
                    if (d[0]?.total_fee_pct != null) {
                        feeRatesMap[p.pairAddress] = parseFloat(d[0].total_fee_pct) / 100;
                    }
                } catch(e) {}
            }
        })());
    }

    await Promise.all(promises);
}

function getFeeRate(p) {
    return feeRatesMap[p.pairAddress] ?? null;
}

function getEstimatedFees(p, period) {
    const rate = getFeeRate(p);
    if (rate == null) return null;
    return getVolume(p, period) * rate;
}

function feeBadgeHtml(p) {
    const rate = getFeeRate(p);
    if (rate == null) return '<span class="fee-badge dynamic">N/A</span>';
    const pct = (rate * 100);
    const label = pct < 0.1 ? pct.toFixed(3) + '%' : pct < 1 ? pct.toFixed(2) + '%' : pct.toFixed(1) + '%';
    const cls = pct <= 0.25 ? 'low' : pct <= 1 ? 'mid' : 'high';
    return `<span class="fee-badge ${cls}">${label}</span>`;
}

function getVolume(p, key) {
    if (!p.volume) return 0;
    const map = { volume24h: 'h24', volume6h: 'h6', volume1h: 'h1' };
    return p.volume[map[key]] || 0;
}

function getLiquidity(p) {
    return p.liquidity?.usd || 0;
}

function getMetricValue(p, metric) {
    if (metric === 'liquidity') return getLiquidity(p);
    if (metric === 'fees24h') return getEstimatedFees(p, 'volume24h') || 0;
    return getVolume(p, metric);
}

async function fetchData() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('loading');
    btn.textContent = '...';

    try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        poolsData = (data.pairs || []).sort((a, b) => getVolume(b, 'volume24h') - getVolume(a, 'volume24h'));
        await fetchFeeRates();
        render();
        document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (err) {
        document.getElementById('poolsGrid').innerHTML = `
            <div class="error-state">
                Failed to fetch pool data: ${err.message}
                <div class="retry" onclick="fetchData()">Click to retry</div>
            </div>`;
    } finally {
        btn.classList.remove('loading');
        btn.textContent = 'Refresh';
    }
}

function render() {
    renderStats();
    renderChart();
    renderPieChart();
    renderPools();
}

function renderStats() {
    const total24h = poolsData.reduce((s, p) => s + getVolume(p, 'volume24h'), 0);
    const total6h = poolsData.reduce((s, p) => s + getVolume(p, 'volume6h'), 0);
    const total1h = poolsData.reduce((s, p) => s + getVolume(p, 'volume1h'), 0);
    const totalLiq = poolsData.reduce((s, p) => s + getLiquidity(p), 0);
    const price = poolsData[0]?.priceUsd ? parseFloat(poolsData[0].priceUsd) : null;
    const priceChange = poolsData[0]?.priceChange?.h24;
    const marketCap = poolsData[0]?.marketCap || poolsData[0]?.fdv || null;

    const totalTxns24 = poolsData.reduce((s, p) => s + (p.txns?.h24?.buys || 0) + (p.txns?.h24?.sells || 0), 0);
    const totalBuys24 = poolsData.reduce((s, p) => s + (p.txns?.h24?.buys || 0), 0);
    const totalSells24 = poolsData.reduce((s, p) => s + (p.txns?.h24?.sells || 0), 0);

    const knownPools = poolsData.filter(p => getFeeRate(p) != null);
    const unknownPools = poolsData.filter(p => getFeeRate(p) == null);
    const totalFees24h = knownPools.reduce((s, p) => s + (getEstimatedFees(p, 'volume24h') || 0), 0);
    const knownVol24h = knownPools.reduce((s, p) => s + getVolume(p, 'volume24h'), 0);
    const unknownVol24h = unknownPools.reduce((s, p) => s + getVolume(p, 'volume24h'), 0);
    const avgFeeRate = knownVol24h > 0 ? (totalFees24h / knownVol24h * 100) : 0;

    document.getElementById('statsRow').innerHTML = `
        <div class="stat-card">
            <div class="stat-label">Price</div>
            <div class="stat-value">${price != null ? '$' + price.toFixed(price < 0.01 ? 8 : price < 1 ? 4 : 2) : '--'}</div>
            <div class="stat-sub ${pctClass(priceChange)}">${fmtPct(priceChange)} (24h)</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Market Cap</div>
            <div class="stat-value">${fmt(marketCap)}</div>
            <div class="stat-sub">FDV</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">24h Volume</div>
            <div class="stat-value">${fmt(total24h)}</div>
            <div class="stat-sub">${poolsData.length} pools</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Liquidity</div>
            <div class="stat-value">${fmt(totalLiq)}</div>
            <div class="stat-sub">across all pools</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">24h Transactions</div>
            <div class="stat-value">${fmtCompact(totalTxns24)}</div>
            <div class="stat-sub"><span class="positive">${fmtCompact(totalBuys24)} buys</span> / <span class="negative">${fmtCompact(totalSells24)} sells</span></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">6h / 1h Volume</div>
            <div class="stat-value">${fmt(total6h)}</div>
            <div class="stat-sub">1h: ${fmt(total1h)}</div>
        </div>
        <div class="stat-card fees-summary">
            <div class="stat-label">Est. 24h Fees</div>
            <div class="stat-value accent">${fmt(totalFees24h)}</div>
            <div class="stat-sub">avg ${avgFeeRate.toFixed(2)}% across ${knownPools.length} pools</div>
        </div>
        <div class="stat-card fees-summary">
            <div class="stat-label">Fee APR (est.)</div>
            <div class="stat-value accent">${totalLiq > 0 ? (totalFees24h / totalLiq * 365 * 100).toFixed(1) + '%' : '--'}</div>
            <div class="stat-sub">${unknownPools.length ? unknownPools.length + ' pools missing fee data' : 'all pools tracked'}</div>
        </div>
    `;
}

const CHART_COLORS = [
    '#7c5cfc', '#22c55e', '#f59e0b', '#ef4444', '#3b82f6',
    '#ec4899', '#14b8a6', '#f97316', '#8b5cf6', '#06b6d4',
    '#e879f9', '#84cc16', '#fb923c', '#a78bfa', '#2dd4bf'
];

function renderChart() {
    const ctx = document.getElementById('volumeChart').getContext('2d');
    const top10 = poolsData.slice(0, 10);
    const labels = top10.map(p => `${poolLabel(p)} (${dexLabel(p)})`);
    const values = top10.map(p => getMetricValue(p, currentMetric));

    if (volumeChart) volumeChart.destroy();

    const metricLabel = {
        volume24h: '24h Volume',
        volume6h: '6h Volume',
        volume1h: '1h Volume',
        liquidity: 'Liquidity (USD)',
        fees24h: 'Est. 24h Fees (USD)'
    }[currentMetric];

    volumeChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels,
            datasets: [{
                label: metricLabel,
                data: values,
                backgroundColor: CHART_COLORS.slice(0, top10.length).map(c => c + '88'),
                borderColor: CHART_COLORS.slice(0, top10.length),
                borderWidth: 1,
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: (ctx) => fmt(ctx.raw)
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: 'rgba(255,255,255,0.04)' },
                    ticks: {
                        color: '#55556a',
                        font: { family: 'SF Mono, monospace', size: 10 },
                        callback: (v) => fmtCompact(v)
                    }
                },
                x: {
                    grid: { display: false },
                    ticks: {
                        color: '#55556a',
                        font: { family: 'SF Mono, monospace', size: 10 },
                        maxRotation: 45
                    }
                }
            }
        }
    });
}

function renderPieChart() {
    const ctx = document.getElementById('pieChart').getContext('2d');
    const top8 = poolsData.slice(0, 8);
    const rest = poolsData.slice(8);
    const restVol = rest.reduce((s, p) => s + getVolume(p, 'volume24h'), 0);

    const labels = top8.map(p => `${poolLabel(p)} (${dexLabel(p)})`);
    const values = top8.map(p => getVolume(p, 'volume24h'));

    if (restVol > 0) {
        labels.push(`Other (${rest.length} pools)`);
        values.push(restVol);
    }

    if (pieChart) pieChart.destroy();

    pieChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels,
            datasets: [{
                data: values,
                backgroundColor: CHART_COLORS.slice(0, labels.length).map(c => c + 'cc'),
                borderColor: '#0a0a0f',
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '55%',
            plugins: {
                legend: {
                    position: 'right',
                    labels: {
                        color: '#8888a0',
                        font: { family: 'SF Mono, monospace', size: 11 },
                        padding: 12,
                        usePointStyle: true,
                        pointStyleWidth: 8
                    }
                },
                tooltip: {
                    callbacks: {
                        label: (ctx) => {
                            const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                            const pct = total > 0 ? ((ctx.raw / total) * 100).toFixed(1) : 0;
                            return `${fmt(ctx.raw)} (${pct}%)`;
                        }
                    }
                }
            }
        }
    });
}

function switchChart(metric, btn) {
    currentMetric = metric;
    document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderChart();
}

function renderPools() {
    const grid = document.getElementById('poolsGrid');
    document.getElementById('poolCount').textContent = poolsData.length;

    if (poolsData.length === 0) {
        grid.innerHTML = '<div class="loading-state"><span>No pools found for this token</span></div>';
        return;
    }

    const total24h = poolsData.reduce((s, p) => s + getVolume(p, 'volume24h'), 0);

    grid.innerHTML = poolsData.map(p => {
        const v24 = getVolume(p, 'volume24h');
        const v6 = getVolume(p, 'volume6h');
        const v1 = getVolume(p, 'volume1h');
        const liq = getLiquidity(p);
        const share = total24h > 0 ? (v24 / total24h * 100) : 0;
        const txns24 = (p.txns?.h24?.buys || 0) + (p.txns?.h24?.sells || 0);
        const buys = p.txns?.h24?.buys || 0;
        const sells = p.txns?.h24?.sells || 0;
        const pairUrl = p.url || `https://dexscreener.com/solana/${p.pairAddress}`;
        const feeRate = getFeeRate(p);
        const mcap = p.marketCap || p.fdv || null;
        const poolType = (p.labels || [])[0] || '--';

        let feesHtml;
        if (feeRate != null) {
            const fees24 = v24 * feeRate;
            const poolApr = liq > 0 ? (fees24 / liq * 365 * 100) : 0;
            feesHtml = `
                <div class="pool-fee-item">
                    <div class="pool-metric-label">Est. 24h Fees</div>
                    <div class="pool-metric-value accent">${fmt(fees24)}</div>
                </div>
                <div class="pool-fee-item">
                    <div class="pool-metric-label">Fee APR</div>
                    <div class="pool-metric-value ${poolApr > 100 ? 'positive' : ''}">${poolApr.toFixed(1)}%</div>
                </div>
                <div class="pool-fee-item">
                    <div class="pool-metric-label">Market Cap</div>
                    <div class="pool-metric-value">${fmt(mcap)}</div>
                </div>`;
        } else {
            feesHtml = `
                <div class="pool-fee-item">
                    <div class="pool-metric-label">Pool Type</div>
                    <div class="pool-metric-value">${poolType}</div>
                </div>
                <div class="pool-fee-item">
                    <div class="pool-metric-label">Fee Data</div>
                    <div class="pool-metric-value" style="color:var(--text-muted)">unavailable</div>
                </div>
                <div class="pool-fee-item">
                    <div class="pool-metric-label">Market Cap</div>
                    <div class="pool-metric-value">${fmt(mcap)}</div>
                </div>`;
        }

        return `
        <div class="pool-card">
            <div class="pool-top">
                <span class="pool-pair">${poolLabel(p)}</span>
                <span class="pool-dex">${dexLabel(p)} ${feeBadgeHtml(p)}</span>
            </div>
            <div class="pool-metrics">
                <div>
                    <div class="pool-metric-label">24h Vol</div>
                    <div class="pool-metric-value">${fmt(v24)}</div>
                </div>
                <div>
                    <div class="pool-metric-label">6h Vol</div>
                    <div class="pool-metric-value">${fmt(v6)}</div>
                </div>
                <div>
                    <div class="pool-metric-label">1h Vol</div>
                    <div class="pool-metric-value">${fmt(v1)}</div>
                </div>
                <div>
                    <div class="pool-metric-label">Liquidity</div>
                    <div class="pool-metric-value">${fmt(liq)}</div>
                </div>
                <div>
                    <div class="pool-metric-label">24h Txns</div>
                    <div class="pool-metric-value">${fmtCompact(txns24)}</div>
                </div>
                <div>
                    <div class="pool-metric-label">Buy / Sell</div>
                    <div class="pool-metric-value">
                        <span class="positive">${fmtCompact(buys)}</span> / <span class="negative">${fmtCompact(sells)}</span>
                    </div>
                </div>
            </div>
            <div class="pool-fees-row">
                ${feesHtml}
            </div>
            <div class="pool-bar-container">
                <div class="pool-bar-label">
                    <span>Volume share</span>
                    <span>${share.toFixed(1)}%</span>
                </div>
                <div class="pool-bar">
                    <div class="pool-bar-fill" style="width:${Math.min(share, 100)}%"></div>
                </div>
            </div>
            <a class="pool-link" href="${pairUrl}" target="_blank" rel="noopener">View on DexScreener &rarr;</a>
        </div>`;
    }).join('');
}

function startAutoRefresh() {
    stopAutoRefresh();
    autoRefreshInterval = setInterval(fetchData, 30000);
}

function stopAutoRefresh() {
    if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
    }
}

fetchData();
startAutoRefresh();
</script>
</body>
</html>
